name: Validate VoxMate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert "<script>" in html and "</script>" in html, "Inline script not found"
          source = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/voxmate-app.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/voxmate-app.js

      - name: Check Worker JavaScript syntax
        run: |
          cp worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Validate web app manifest
        run: python -c "import json; json.load(open('manifest.webmanifest', encoding='utf-8'))"

      - name: Check that no Gemini key is committed to the frontend
        run: |
          if grep -Eq 'AIza[0-9A-Za-z_-]{30,}' index.html; then
            echo "Possible API key found in frontend. Remove it immediately."
            exit 1
          fi
